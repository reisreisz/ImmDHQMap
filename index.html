    // Helper: Calculate path stats
    function calculatePathStats(pathCoords) {
      let totalMeters = 0;
      for (let i = 0; i < pathCoords.length - 1; i++) {
        const p1 = L.latLng(pathCoords[i][0], pathCoords[i][1]);
        const p2 = L.latLng(pathCoords[i + 1][0], pathCoords[i + 1][1]);
        totalMeters += p1.distanceTo(p2);
      }
      const meters = Math.round(totalMeters);
      const mins = Math.max(1, Math.round(meters / 75));
      return { mins, meters };
    }

    // 5. Initialize Map with Lands Department GeoCommunity Map Tiles
    
    // Approximate bounding box for Tseung Kwan O [South, West] to [North, East]
    const tkoBounds = L.latLngBounds(
      [22.301813, 114.251096], // South-West 
      [22.307530, 114.261600]  // North-East 
    );
    
    //const map = L.map('map', { zoomControl: false }).setView([22.3058, 114.2568], 16);
    const map = L.map('map', {
      zoomControl: false,      // Keeps your custom/disabled zoom control setting
      maxBounds: tkoBounds,
      maxBoundsViscosity: 1.0, // Solid boundary when dragging
      minZoom: 15,             // Prevents zooming out too far
      maxZoom: 20              // Matches Lands Dept tile maxZoom
    }).setView([22.3058, 114.2568], 16);
    

    // Testing by OpenStreetMap
    //L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      //maxZoom: 19,
      //attribution:
        //'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    //}).addTo(map);

    
    // Lands Dept Map Tile Layer (using standard Open Map / Combined Map Service)
   //L.tileLayer('https://mapapi.hkmapservice.gov.hk/gs/api/v1.0.0/xyz/basemap/WGS84/{z}/{x}/{y}.png', {
   //     maxZoom: 20,
   //     minZoom: 10,
   //     attribution:
   //       '地圖資料 © 香港特別行政區政府地政總署<br>' +
   //       'Map data © Lands Department, The Government of the Hong Kong SAR'
    //  }
   // ).addTo(map);

 // Lands Dept Map Tile Layer (using Image Map)
   L.tileLayer('https://mapapi.hkmapservice.gov.hk/gs/api/v1.0.0/xyz/basemap/WGS84/{z}/{x}/{y}.png', {
        maxZoom: 20,
        minZoom: 10,
        attribution:
          '地圖資料 © 香港特別行政區政府地政總署<br>' +
          'Map data © Lands Department, The Government of the Hong Kong SAR'
     }
    ).addTo(map);
    const labelLayers = {
      'zh-HK': L.tileLayer(
        'https://mapapi.hkmapservice.gov.hk/gs/api/v1.0.0/xyz/label/hk/tc/WGS84/{z}/{x}/{y}.png',
        { maxZoom: 20, minZoom: 8 }
      ),
      'zh-CN': L.tileLayer(
        'https://mapapi.hkmapservice.gov.hk/gs/api/v1.0.0/xyz/label/hk/sc/WGS84/{z}/{x}/{y}.png',
        { maxZoom: 20, minZoom: 8 }
      ),
      'en': L.tileLayer(
        'https://mapapi.hkmapservice.gov.hk/gs/api/v1.0.0/xyz/label/hk/en/WGS84/{z}/{x}/{y}.png',
        { maxZoom: 20, minZoom: 8 }
      )
    };

    let activeLabelLayer = labelLayers[currentLang].addTo(map);
    

    const hqMarker = L.marker(IMMD_HQ).addTo(map)
      .bindPopup(uiStrings[currentLang].hqPopup).openPopup();

    // Highlight Immigration HQ footprint with a yellow polygon
    // Replace these corner [lat, lng] coordinates with the exact building outline if needed
    const immdHqPolygonCoords = [
      [22.305666, 114.257061], // West / South-West corner
      [22.305900, 114.257748], // North / North-East corner
      [22.305669, 114.257791], // East corner
      [22.305644, 114.257724], // East step-in
      [22.305349, 114.257834], // South-East corner
      [22.305150, 114.257281]  // South / South-West corner
    ];

    const immdHqPolygon = L.polygon(immdHqPolygonCoords, {
      color: '#d97706',       // Amber/gold border so it stands out cleanly
      weight: 2.5,
      opacity: 0.95,
      fillColor: '#facc15',   // Bright yellow fill
      fillOpacity: 0.35
    })
      .addTo(map)
      .bindPopup(uiStrings[currentLang].hqPopup);
    
    let currentLine = null;
    let startMarker = null;
    let routeStepMarkers = [];
    let parkingPolygons = [];

    
        // 6. Switch Language Handler
    function updateLabelLayer(lang) {
      const nextLayer = labelLayers[lang] || labelLayers['en'];
      if (activeLabelLayer && activeLabelLayer !== nextLayer && map.hasLayer(activeLabelLayer)) {
        map.removeLayer(activeLabelLayer);
      }
      if (!map.hasLayer(nextLayer)) {
        nextLayer.addTo(map);
      }
      activeLabelLayer = nextLayer;
    }
    function setLanguage(lang, btnElement) {
      currentLang = lang;
      document.documentElement.lang = lang;
    
      document.querySelectorAll('.lang-btn').forEach(b => {
        b.classList.remove('active');
      });
    
      if (btnElement) {
        btnElement.classList.add('active');
      }
    
      const t = uiStrings[lang];
    
      document.getElementById('ui-title').textContent = t.title;
      document.getElementById('ui-subtitle').textContent = t.subtitle;
      document.getElementById('tab-mtr').textContent = t.tabMtr;
      document.getElementById('tab-bus').textContent = t.tabBus;
      document.getElementById('tab-parking').textContent = t.tabParking;
    
      hqMarker.setPopupContent(t.hqPopup);
      immdHqPolygon.setPopupContent(t.hqPopup);
      // Switch map place-name label tiles to match the selected language
      updateLabelLayer(lang);
    
      renderOptions(currentCategory, selectedIndex);
    }
    
    // 7. Render Custom Transport Options
    function filterCategory(category, btnElement) {
      currentCategory = category;
      selectedIndex = 0;
    
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.remove('active');
      });
    
      if (btnElement) {
        btnElement.classList.add('active');
      }
    
      renderOptions(category, 0);
    }
    
    function renderOptions(category, activeIndex) {
      const container = document.getElementById('options-container');
      container.innerHTML = '';
    
      const items = transportData[category];
    
      items.forEach((item, index) => {
        const stats = calculatePathStats(item.path);
    
        const card = document.createElement('div');
        card.className = 'route-card';
    
        card.innerHTML = `
          <div>
            <div class="route-title">${item.name[currentLang]}</div>
            <div class="route-sub">${item.desc[currentLang]}</div>
          </div>
          <div class="route-badge">
            ${uiStrings[currentLang].routeEstimate(stats.mins, stats.meters)}
          </div>
        `;
    
        card.onclick = () => selectRoute(item, card, index);
        container.appendChild(card);
    
        if (index === activeIndex) {
          selectRoute(item, card, index);
        }
      });
    }
    
    // 8. Draw Your Custom Waypoint Path and Turn Instructions
    function selectRoute(item, cardElement, index) {
      if (parkingPolygons.length > 0) {
        parkingPolygons.forEach(poly => map.removeLayer(poly));
        parkingPolygons = [];
      }

      transportData.parking.forEach(park => {
        if (!park.polygon) return;

        const isSelectedParking = park.id === item.id;
        const poly = L.polygon(park.polygon, {
          color: park.color,
          weight: isSelectedParking ? 3 : 2,
          opacity: isSelectedParking ? 1 : 0.8,
          fillColor: park.fillColor,
          fillOpacity: isSelectedParking ? 0.45 : 0.25
        })
          .addTo(map)
          .bindPopup(`<b>${park.name[currentLang]}</b><br>${park.desc[currentLang]}`);

        parkingPolygons.push(poly);
      });
      selectedIndex = index;
    
      document.querySelectorAll('.route-card').forEach(card => {
        card.classList.remove('selected');
      });
    
      cardElement.classList.add('selected');
    
      if (currentLine) {
        map.removeLayer(currentLine);
      }
    
      if (startMarker) {
        map.removeLayer(startMarker);
      }
    
      if (routeStepMarkers.length > 0) {
        routeStepMarkers.forEach(marker => map.removeLayer(marker));
        routeStepMarkers = [];
      }
    
      currentLine = L.polyline(item.path, {
        color: '#0066cc',
        weight: 6,
        opacity: 0.85,
        dashArray: '10, 10'
      }).addTo(map);
    
      if (item.steps) {
        item.steps.forEach(step => {
          const stepMarker = L.circleMarker(step.coords, {
            radius: 6,
            color: '#ffffff',
            fillColor: '#0066cc',
            fillOpacity: 1,
            weight: 2
          })
            .bindTooltip(step.text[currentLang], {
              permanent: true,
              direction: 'top',
              className: 'route-step-tooltip'
            })
            .addTo(map);
    
          routeStepMarkers.push(stepMarker);
        });
      }
    
      const stats = calculatePathStats(item.path);
    
      const popupText =
        `<b>${uiStrings[currentLang].startPrefix}</b>` +
        `${item.name[currentLang]}<br>` +
        `<span style="color:#0066cc;font-weight:700;">` +
        `${uiStrings[currentLang].routeEstimate(stats.mins, stats.meters)}` +
        `</span>`;
    
      startMarker = L.circleMarker(item.path[0], {
        radius: 8,
        fillColor: '#ff5722',
        color: '#ffffff',
        weight: 2,
        fillOpacity: 1
      })
        .addTo(map)
        .bindPopup(popupText)
        .openPopup();
    
      map.fitBounds(currentLine.getBounds(), { padding: [75, 75] });
    }
    
    // Initialize default view
    renderOptions('mtr', 0);
</script>
